name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Check
        run: cargo check --release
      - name: Test
        run: cargo test --release

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/flutter
    env:
      MAKCO_KEYSTORE_BASE64: ${{ secrets.MAKCO_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Restore release keystore
        if: env.MAKCO_KEYSTORE_BASE64 != ''
        run: echo "$MAKCO_KEYSTORE_BASE64" | base64 -d > android/makco-release.jks
      - name: Build release APK
        if: env.MAKCO_KEYSTORE_BASE64 != ''
        run: flutter build apk --release
      - name: Build debug APK
        if: env.MAKCO_KEYSTORE_BASE64 == ''
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: makco-apk
          path: frontend/flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
