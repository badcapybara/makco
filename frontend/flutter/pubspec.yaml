name: makco
description: "MAKCO - Chennai transit booking. Madras Flow design."
publish_to: 'none'
version: 3.3.0+330

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  webview_flutter: ^4.8.0
  flutter_secure_storage: ^9.2.4
  geolocator: ^13.0.2
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans.ttf
